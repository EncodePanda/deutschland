<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Słówka – niemiecki</title>
  <meta name="description" content="Gra do nauki niemieckich słówek: polski → niemiecki i niemiecki → polski.">
  <meta name="theme-color" content="#f6f4ef" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#14171f" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%233b5bdb'/%3E%3Ctext x='16' y='23' font-family='system-ui,sans-serif' font-size='20' font-weight='700' text-anchor='middle' fill='white'%3E%C3%A4%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="stripe" aria-hidden="true"></div>
  <main id="app" class="app">
    <p class="loading">Wczytywanie słówek…</p>
  </main>
  <noscript><p class="loading">Ta gra wymaga włączonej obsługi JavaScript.</p></noscript>
  <script>
    // Browsers refuse to load the game's scripts and vocabulary from file://,
    // so say so instead of showing "loading" forever.
    if (location.protocol === 'file:') {
      document.getElementById('app').innerHTML =
        '<section class="card result-card"><h1>Gra nie działa z pliku</h1>' +
        '<p class="subtitle">Przeglądarka blokuje wczytywanie gry bezpośrednio z dysku. ' +
        'Uruchom w folderze gry polecenie <b>npm start</b> i otwórz ' +
        '<b>http://localhost:8000</b>, albo otwórz grę z GitHub Pages.</p></section>';
    }
  </script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
